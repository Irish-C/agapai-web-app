services:
  server:
    volumes:
      - ./server:/app:delegated
      - ./ml:/ml:delegated
    command: >
      sh -c "python -m prisma generate --schema=prisma/schema.prisma && \
             npx --yes prisma@4 migrate deploy --schema=prisma/schema.prisma && \
             uvicorn app:asgi_app --host 0.0.0.0 --port 5000 --reload"
    environment:
      - PYTHONUNBUFFERED=1
      - NPM_CONFIG_YES=true
    ports:
      - "5000:5000"
