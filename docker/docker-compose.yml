networks:
  agapai:
    driver: bridge

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - ../.env.docker
    volumes:
      - pgdata:/var/lib/postgresql/data
    # REMOVED: - ./server:/app (Not needed for DB)
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-admin} -d $${POSTGRES_DB:-agapai_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agapai

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - agapai

  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    restart: unless-stopped
    ports:
      - "8554:8554"
      - "1935:1935"
      - "8080:8080"
      - "9997:9997"
      - "8888:8888" # HLS
      - "8889:8889" # WebRTC
      - "8890:8890/udp"
      - "8189:8189/udp"
    environment:
      MTX_RTSPTRANSPORTS: "tcp"
      MTX_WEBRTCADDITIONALHOSTS: "${MTX_WEBRTC_HOST}"
    volumes:
      - ../server/mediamtx.yml:/mediamtx.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - agapai

  server:
    image: server:latest
    build:
      context: ../server
      dockerfile: Dockerfile
    restart: on-failure
    env_file:
      - ../.env.docker
    command: ["uvicorn", "app:asgi_app", "--host", "0.0.0.0", "--port", "5000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ../server:/app
      - server_node_modules:/app/node_modules
    ports:
      - "5000:5000"
    networks:
      - agapai
    environment:
      - PRISMA_MIGRATE=true
      - PYTHONUNBUFFERED=1
      - PRISMA_PY_DEBUG_GENERATOR=1
      - MEDIAMTX_URL=rtsp://mediamtx:8554
      - MEDIAMTX_API=http://mediamtx:8080
      - MEDIAMTX_MANAGE=false
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s = socket.socket(socket.AF_INET, socket.SOCK_STREAM); s.connect(('localhost', 5000))"]
      interval: 10s
      timeout: 5s
      retries: 3
  seed:
    image: server:latest
    env_file:
      - ../.env.docker
    depends_on:
      server:
        condition: service_healthy
    networks:
      - agapai
    entrypoint: ["python", "seed_db.py"]
    restart: "no"

volumes:
  pgdata:
  redis_data:
  server_node_modules:
