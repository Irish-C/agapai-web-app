networks:
  agapai:
    driver: bridge

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    # Pulling credentials from .env to ensure they match the server
    env_file:
      - ./server/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server:/app
    ports:
      - "5432:5432"
    healthcheck:
      # Using $$ to escape the variable for the shell test
      test: ["CMD-SHELL", "pg_isready -U admin -d agapai_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agapai

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - agapai

  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    restart: unless-stopped
    ports:
      - "8554:8554"  # RTSP
      - "1935:1935"  # RTMP
      - "8080:8080"  # HTTP (web/API)
      - "8888:8888" # HLS
      - "8889:8889" # WebRTC HTTP
      - "8890:8890/udp" # SRT
      - "8189:8189/udp" # ICE/UDP
    environment:
      MTX_RTSPTRANSPORTS: "tcp"
      # Replace with your LAN/public IPs for WebRTC ICE candidates (comma separated)
      MTX_WEBRTCADDITIONALHOSTS: "192.168.254.113"  
    volumes:
      - ./server/mediamtx.yml:/mediamtx.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - agapai

  server:
    restart: on-failure
    image: server:latest
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - ./server/.env
    command: ["uvicorn", "app:asgi_app", "--host", "0.0.0.0", "--port", "5000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./server:/app
      # Prevents local node_modules from overwriting the container's prisma install
      - server_node_modules:/app/node_modules
    ports:
      - "5000:5000"
    networks:
      - agapai
    environment:
      - PRISMA_MIGRATE=true
      - PYTHONUNBUFFERED=1
      - PRISMA_PY_DEBUG_GENERATOR=1
      - MEDIAMTX_URL=rtsp://mediamtx:8554
      - MEDIAMTX_API=http://mediamtx:8080
      - MEDIAMTX_MANAGE=false

  seed:
    image: server:latest
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - ./server/.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agapai
    entrypoint: ["python", "seed_db.py"]
    # This will only run once and then stop
    restart: "no"

volumes:
  pgdata:
  redis_data:
  server_node_modules: