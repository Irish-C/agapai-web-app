networks:
  agapai:
    driver: bridge

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agapai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-agapai}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agapai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agapai

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - agapai

  # MediaMTX service removed temporarily because image pull failed.
  # To enable, add a working image (e.g. ghcr.io/aler9/mediamtx:latest) or bundle the binary.

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./server/.env
    depends_on:
      - postgres
      - redis
    ports:
      - "5000:5000"
    networks:
      - agapai
    command: ["uvicorn", "app:asgi_app", "--host", "0.0.0.0", "--port", "5000", "--reload"]

  seed:
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - ./server/.env
    depends_on:
      - postgres
    entrypoint: ["python", "seed_db.py"]
    environment:
      - AGAPAI_SEED_PASSWORD=${AGAPAI_SEED_PASSWORD}
    restart: "no"

volumes:
  pgdata:
